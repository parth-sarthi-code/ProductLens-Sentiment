[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "productlens-sentiment"
version = "1.0.0"
description = "ProductLens Production Hierarchical Mixture of Experts Aspect-Based Sentiment Analysis Platform"
authors = [{ name = "ProductLens Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.2.0",
    "pandas>=1.5.0",
    "pyarrow>=12.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["productlens*"]

