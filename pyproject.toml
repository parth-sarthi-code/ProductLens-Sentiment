[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "projectlens-3"
version = "3.0.0"
description = "ProductLens 3.0: High-Precision Aspect-Based Sentiment Intelligence"
readme = "productlens_5_stage_plan.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
